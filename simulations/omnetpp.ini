# ============================================================
# omnetpp.ini — NET-OPT ADVANCED v5
# PDC Spring 2026 | Section B
# 5 Scenarios: NormalDay, RegistrationPeak, OptimizedNetwork,
#              StaggeredRegistration (NEW), StressTest
# ============================================================

[General]
network         = netopt.CampusNetwork
sim-time-limit  = 300s
record-eventlog = false
result-dir      = results/
ned-path        = ../src

**.scalar-recording = true
**.vector-recording = true

# -------------------------------------------------------
# SCENARIO 1: Normal Day — healthy baseline
# -------------------------------------------------------
[Config NormalDay]
description = "Normal campus day — no registration peak"
sim-time-limit = 180s

**.adminBlock.numStudents = 15
**.csBlock.numStudents    = 20
**.library.numStudents    = 10

**.students[*].isRegistering = false
**.students[*].dataRate      = 5Mbps
**.students[*].priority      = 2

**.ap[*].maxClients  = 50
**.ap[*].bandwidth   = 300Mbps

**.regServer.maxConcurrentSessions = 200
**.regServer.processingTime        = 20ms

# -------------------------------------------------------
# SCENARIO 2: Registration Peak — MAIN DEMO (bottlenecks)
# -------------------------------------------------------
[Config RegistrationPeak]
description = "Registration peak — CS Block bottleneck expected!"
sim-time-limit = 600s

**.adminBlock.numStudents = 30
**.csBlock.numStudents    = 40
**.library.numStudents    = 20

**.students[*].isRegistering = true
**.students[*].dataRate      = 20Mbps
**.students[*].arrivalWindow = 4.0s   # Compress the peak so the GUI shows a real burst
**.students[*].maxRetries     = 50    # Let peak registrations keep retrying until they succeed

# Tight AP limits so bottleneck triggers visibly
**.ap[*].maxClients  = 3
**.ap[*].bandwidth   = 300Mbps
**.ap[*].txPower     = 20.0

**.regServer.maxConcurrentSessions = 200
**.regServer.processingTime        = 75ms
# Use the legacy time-based health curve for the demo registration peak
**.monitor.useTimeProfile = true

# -------------------------------------------------------
# SCENARIO 3: Optimized Network — hardware upgrade solution
# -------------------------------------------------------
[Config OptimizedNetwork]
description = "Optimized — upgraded APs + server"
sim-time-limit = 300s

**.adminBlock.numStudents = 30
**.csBlock.numStudents    = 40
**.library.numStudents    = 20

**.students[*].isRegistering = true
**.students[*].dataRate      = 20Mbps
**.students[*].arrivalWindow = 4.0s   # Show visible message passing without saturation

# Upgraded: more capacity, higher limits
**.ap[*].maxClients  = 80
**.ap[*].bandwidth   = 600Mbps
**.ap[*].txPower     = 23.0

**.regServer.maxConcurrentSessions = 400
**.regServer.processingTime        = 25ms

# -------------------------------------------------------
# SCENARIO 4: Staggered Registration (NEW) — software solution
# CS registers first, then Admin, then Library
# Shows bottleneck solved WITHOUT hardware upgrades
# -------------------------------------------------------
[Config StaggeredRegistration]
description = "Staggered by department — software solution, no HW upgrade"
sim-time-limit = 300s

**.adminBlock.numStudents = 30
**.csBlock.numStudents    = 40
**.library.numStudents    = 20

**.students[*].isRegistering = true
**.students[*].dataRate      = 20Mbps

# Same hardware as RegistrationPeak — only scheduling changes
**.ap[*].maxClients  = 8
**.ap[*].bandwidth   = 300Mbps

# CS students: priority 1 (arrive earliest ~30s)
**.csBlock.students[*].priority = 1
# Admin students: priority 2 (arrive ~45s)
**.adminBlock.students[*].priority = 2
# Library students: priority 3 (arrive ~60s)
**.library.students[*].priority = 3

**.regServer.maxConcurrentSessions = 200
**.regServer.processingTime        = 50ms
# Use the legacy time-based health curve for staggered demo
**.monitor.useTimeProfile = true

# -------------------------------------------------------
# SCENARIO 5: Stress Test — absolute worst case
# Tight burst plus reduced AP/server capacity to keep the bottleneck visible
# -------------------------------------------------------
[Config StressTest]
description = "Stress test — high load with visible bottleneck"
sim-time-limit = 300s

**.adminBlock.numStudents = 40
**.csBlock.numStudents    = 60
**.library.numStudents    = 20

**.students[*].isRegistering = true
**.students[*].dataRate      = 20Mbps
**.students[*].priority      = 2
**.students[*].arrivalWindow = 2.0s   # Force a tight burst so requests overlap

**.ap[*].maxClients  = 4
**.ap[*].bandwidth   = 300Mbps

**.regServer.maxConcurrentSessions = 20
**.regServer.processingTime        = 200ms
# StressTest: use dedicated severe-collapse profile
**.monitor.useTimeProfile = true
**.monitor.stressProfile = true
